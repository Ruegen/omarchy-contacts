# Super+C opens Contacts. Copy this bind into ~/.config/hypr/bindings.lua
# as:
#   o.bind("SUPER + C", "Contacts", "omarchy-shell shell toggle omarchy-contacts '{}'")
# or source this file from hyprland.conf if you still use that form.
bindd = SUPER, C, omarchy-contacts, exec, omarchy-shell shell toggle omarchy-contacts '{}'
