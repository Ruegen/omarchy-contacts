[package]
name = "omarchy-contactsd"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Omarchy Contacts daemon: local vCard store, CardDAV sync, Unix-socket IPC"
authors = ["Ruegen"]

[[bin]]
name = "omarchy-contactsd"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
csv = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "3", default-features = false, features = ["rustls"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
lto = true
opt-level = "s"
